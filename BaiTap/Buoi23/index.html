<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://cdn.tailwindcss.com"></script>
      <title>Buoi 23</title>
</head>

<body class="min-h-screen bg-slate-950 text-white">
      <header class="border-b border-white/10">
            <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
                  <a href="#" class="text-2xl font-bold tracking-tight text-cyan-400">Postly</a>
                  <div class="flex items-center gap-3">
                  </div>
            </nav>
      </header>

      <main>
            <section class="mx-auto max-w-6xl px-6 py-24 text-center">
                  <p class="mb-4 font-semibold uppercase tracking-[0.25em] text-cyan-400">Share what matters</p>
                  <h1 class="mx-auto max-w-3xl text-5xl font-black leading-tight sm:text-6xl">Ideas worth reading, all
                        in one place.</h1>
                  <p class="mx-auto mt-6 max-w-2xl text-lg text-slate-400">Discover thoughtful stories and join a
                        community built for sharing better ideas.</p>
                  <div class="mt-8 flex justify-center gap-4">
                        <button id="login_btn"
                              class="rounded-lg bg-cyan-400 px-6 py-3 font-semibold text-slate-950 hover:bg-cyan-300 min-w-60">Login</button>
                        <button id="logout_btn"
                              class="rounded-lg bg-cyan-400 px-6 py-3 font-semibold text-slate-950 hover:bg-cyan-300 min-w-60 ">Log
                              Out</button>
                  </div>
            </section>

            <section id="posts" class="mx-auto hidden max-w-6xl px-6 pb-20">
                  <div class="mb-8">
                        <p class="font-semibold uppercase tracking-widest text-cyan-400">Your feed</p>
                        <h2 class="mt-2 text-3xl font-bold">Latest posts</h2>
                  </div>
                  <div class="grid gap-6 md:grid-cols-3" id="posts_list">
                        <article class="rounded-2xl border border-white/10 bg-white/5 p-6"><span
                                    class="text-sm text-cyan-400">Design</span>
                              <h3 class="mt-4 text-xl font-bold">Building simple experiences</h3>
                              <p class="mt-3 text-slate-400">Small details create products people love to use.</p>
                              <div class="mt-8 flex justify-center gap-4">
                                    <button type="button" data-modal-target="edit_post_modal"
                                          class="rounded-lg bg-cyan-400 px-4 py-2 font-semibold text-slate-950 hover:bg-cyan-300">
                                          Edit
                                    </button>
                              </div>
                        </article>

                        <div id="edit_post_modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 p-6"
                              role="dialog" aria-modal="true" aria-labelledby="edit_post_title">
                              <div class="w-full max-w-lg rounded-2xl border border-white/10 bg-slate-900 p-6 shadow-2xl">
                                    <div class="flex items-center justify-between">
                                          <h2 id="edit_post_title" class="text-2xl font-bold">Edit post</h2>
                                          <button type="button" aria-label="Close edit modal"
                                                class="text-2xl text-slate-400 hover:text-white">&times;</button>
                                    </div>
                                    <form class="mt-6 space-y-5">
                                          <div>
                                                <label for="edit_title" class="mb-2 block font-semibold">Title</label>
                                                <input id="edit_title" name="title" type="text"
                                                      class="w-full rounded-lg border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-cyan-400"
                                                      placeholder="Post title" required>
                                          </div>
                                          <div>
                                                <label for="edit_body" class="mb-2 block font-semibold">Body</label>
                                                <textarea id="edit_body" name="body" rows="6"
                                                      class="w-full rounded-lg border border-white/10 bg-white/5 px-4 py-3 text-white outline-none focus:border-cyan-400"
                                                      placeholder="Write your post..." required></textarea>
                                          </div>
                                          <div class="flex justify-end gap-3">
                                                <button type="button"
                                                      class="rounded-lg border border-white/10 px-4 py-2 font-semibold hover:bg-white/10">Cancel</button>
                                                <button type="submit"
                                                      class="rounded-lg bg-cyan-400 px-4 py-2 font-semibold text-slate-950 hover:bg-cyan-300">Save changes</button>
                                          </div>
                                    </form>
                              </div>
                        </div>

                  </div>
            </section>
      </main>
      
</body>
<script type="module" src="./index.js"></script>

</html>
